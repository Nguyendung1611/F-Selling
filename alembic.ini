[alembic]
script_location = %(here)s/migrations
prepend_sys_path = .

# F-Selling does not use ``alembic upgrade`` directly.  The checked-in graph is
# loaded by ``python -m fselling.migration.cli`` so the coordinator can wrap one
# revision, version row, journal row, verifier and successful attempt in the
# same SQLite BEGIN IMMEDIATE transaction.

[loggers]
keys = root

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
