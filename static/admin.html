<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0F172A">
    <link rel="manifest" href="/manifest.json">
    <link rel="apple-touch-icon" href="/img/icon-192.png">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="F-Selling">
    <title data-i18n="admin.page_title">Bảng điều khiển Admin | F-Selling</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css?v=20260731-i18n4">
    <link rel="stylesheet" href="/css/admin.css?v=20260801-tra-hang">
</head>
<body>
    <div class="nav-bar">
        <!-- <h2 class="text-gradient">Quản trị viên F-Selling</h2> -->
        <img class="logo" src="img/logo.png" alt="F-Selling">
        <div class="flex-row">
            <label for="languageSelector" style="display: flex; align-items: center; gap: 0.4rem; margin: 0;">
                <span data-i18n="common.language" style="font-size: 0.85rem; font-weight: 600;">Ngôn ngữ</span>
                <select id="languageSelector"
                        data-language-selector
                        data-i18n-aria-label="admin.language_selector_aria"
                        data-i18n-title="admin.language_selector_aria"
                        style="width: auto; margin: 0; padding: 0.45rem 0.6rem;">
                    <option value="vi" data-i18n="common.language.vi">Tiếng Việt</option>
                    <option value="en" data-i18n="common.language.en">English</option>
                </select>
            </label>
            <button onclick="navigateToPage('/seller')" data-i18n="admin.nav.purchasing">Nhập Hàng</button>
            <button onclick="downloadExcel()" data-i18n="common.export_excel">Xuất Excel</button>
            <button class="btn-outline" onclick="showChangePasswordModal()" data-i18n="common.change_password">Đổi mật khẩu</button>
            <button class="btn-outline" onclick="logout()" data-i18n="common.logout">Đăng xuất</button>
        </div>
    </div>

    <div class="container">
        <!-- Tabs Header -->
        <div class="tabs-wrapper">
            <button class="tab-btn active" onclick="switchTab('dashboard', this)" data-i18n="admin.tab.dashboard">Doanh thu Shop</button>
            <button class="tab-btn" onclick="switchTab('logs', this)" data-i18n="admin.tab.logs">Nhật Ký Hệ Thống</button>
        </div>

        <div id="dashboard" class="tab-content active glass-card">
            <h3 data-i18n="admin.dashboard.title">Doanh thu các Shop</h3>
            <div class="table-responsive">
                <table>
                    <thead>
                        <tr>
                            <th data-i18n="admin.dashboard.shop_name">Tên Shop</th>
                            <th data-i18n="admin.dashboard.total_revenue">Tổng doanh thu (VNĐ)</th>
                        </tr>
                    </thead>
                    <tbody id="shopList">
                        <!-- Populated by JS -->
                    </tbody>
                </table>
            </div>
        </div>
        
        <div id="logs" class="tab-content glass-card">
            <h3 data-i18n="admin.logs.title">Nhật Ký Hệ Thống</h3>
            <div class="table-responsive">
                <table class="db-table" style="margin-top: 1rem;">
                    <thead>
                        <tr>
                            <th data-i18n="admin.logs.id">ID</th>
                            <th data-i18n="admin.logs.time">Thời gian</th>
                            <th data-i18n="admin.logs.user">Người dùng</th>
                            <th data-i18n="admin.logs.action">Hành động</th>
                            <th data-i18n="admin.logs.details">Chi tiết</th>
                        </tr>
                    </thead>
                    <tbody id="logList">
                        <!-- Populated by JS -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <div id="toast" aria-live="polite"></div>

    <!-- Modal Đổi Mật Khẩu -->
    <div id="changePasswordModal"
         role="dialog"
         aria-modal="true"
         data-i18n-aria-label="admin.change_password.title"
         style="display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.6); z-index: 1000; align-items: center; justify-content: center;">
        <div class="glass-card" style="max-width: 400px; width: 90%; background: var(--card-bg); text-align: center; position: relative;">
            <button type="button"
                    onclick="closeChangePasswordModal()"
                    data-i18n-aria-label="admin.change_password.close_aria"
                    data-i18n-title="admin.change_password.close_aria"
                    style="position: absolute; top: 1rem; right: 1rem; background: none; border: none; color: var(--text-muted); font-size: 1.5rem; cursor: pointer; box-shadow: none; padding: 0;">&times;</button>
            
            <h3 class="text-gradient" data-i18n="admin.change_password.title" style="margin-top: 1rem;">Đổi mật khẩu</h3>
            
            <form id="changePasswordForm" data-i18n-aria-label="admin.change_password.form_aria">
                <div style="text-align: left;">
                    <label for="oldPassword" data-i18n="auth.password.current_label" style="display: block; font-size: 0.9rem; font-weight: 600; margin-bottom: 0.5rem;">Mật khẩu hiện tại</label>
                    <input type="password"
                           id="oldPassword"
                           autocomplete="current-password"
                           data-i18n-placeholder="auth.password.current_placeholder"
                           required>
                </div>
                <div style="text-align: left;">
                    <label for="newPassword" data-i18n="auth.password.new_label" style="display: block; font-size: 0.9rem; font-weight: 600; margin-bottom: 0.5rem;">Mật khẩu mới</label>
                    <input type="password"
                           id="newPassword"
                           autocomplete="new-password"
                           data-i18n-placeholder="auth.password.new_placeholder"
                           required>
                </div>
                <div style="text-align: left;">
                    <label for="confirmNewPassword" data-i18n="auth.password.confirm_new_label" style="display: block; font-size: 0.9rem; font-weight: 600; margin-bottom: 0.5rem;">Xác nhận mật khẩu mới</label>
                    <input type="password"
                           id="confirmNewPassword"
                           autocomplete="new-password"
                           data-i18n-placeholder="auth.password.confirm_new_placeholder"
                           required>
                </div>
                <button type="submit" data-i18n="admin.change_password.submit" style="width: 100%; margin-top: 0.5rem;">Cập nhật mật khẩu</button>
            </form>
            
            <div id="changePasswordErrorMsg" aria-live="polite" style="color: #ef4444; margin-top: 1rem; text-align: center; font-size: 0.9rem;"></div>
            <div id="changePasswordSuccessMsg" aria-live="polite" style="color: var(--success); margin-top: 1rem; text-align: center; font-weight: 600; font-size: 0.9rem;"></div>
        </div>
    </div>

    <script src="/js/vendor/i18next-26.3.6.min.js?v=20260731-i18n4"></script>
    <script src="/js/locales/common.js?v=20260802-han-su-dung"></script>
    <script src="/js/locales/auth-admin.js?v=20260807-admin-nhap-hang"></script>
    <script src="/js/i18n.js?v=20260731-i18n4"></script>
    <script src="/js/api.js?v=20260807-admin-nhap-hang"></script>
    <script src="/js/admin.js?v=20260731-i18n4"></script>
    <script src="/js/pwa.js?v=20260806-pwa"></script>
</body>
</html>
