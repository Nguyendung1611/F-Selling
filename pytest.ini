[pytest]
testpaths = tests
pythonpath = . tests
# --basetemp: giữ thư mục tạm của pytest trong dự án thay vì %TEMP%\pytest-of-*.
# Ở thư mục mặc định, pytest tạo symlink 'pytest-current'; nếu symlink đó hỏng
# thì bước dọn dẹp cuối phiên ném PermissionError và pytest thoát với mã lỗi
# DÙ MỌI TEST ĐỀU PASS - làm test-commit.ps1 báo "TEST FAIL" giả và không chịu
# commit. Thư mục riêng trong dự án không có symlink nên không dính lỗi này.
addopts = -q --basetemp=.pytest-tmp
filterwarnings =
    ignore::DeprecationWarning
