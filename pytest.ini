[pytest]
testpaths = tests
pythonpath = . tests
# KHÔNG khai --basetemp ở đây. Thư mục tạm được `tests/conftest.py` đặt bằng
# `pytest_configure`, vào đúng thư mục `tempfile.mkdtemp()` mà nó vốn đã tạo cho
# DB test - xem ghi chú dài trong conftest. Hai bản trước đều hỏng theo hai kiểu
# khác nhau và cả hai đều làm test-commit.ps1 báo "TEST FAIL" GIẢ:
#
#   - Mặc định (%TEMP%\pytest-of-*): pytest tạo symlink 'pytest-current', symlink
#     hỏng thì bước dọn cuối phiên ném PermissionError.
#   - .pytest-tmp trong dự án: thư mục này đã dính hỏng ACL trên máy dev, đọc
#     còn không được, nên mọi test dùng `tmp_path` đều lỗi PermissionError.
# --durations=10: in 10 test chậm nhất sau mỗi lần chạy. CỐ Ý không kèm
# pytest-timeout: bộ test ở máy là lưới an toàn DUY NHẤT (CI không chạy), mà
# ngưỡng thời gian mỗi test sẽ đỏ oan đúng những lúc máy bận - và test-commit.ps1
# chặn commit khi có test đỏ. Đỏ oan là cách nhanh nhất khiến người ta bắt đầu
# bỏ qua bộ test. Ở đây chỉ thêm thông tin, không thêm đường thất bại nào.
addopts = -q --basetemp=.pytest-tmp --durations=10
filterwarnings =
    ignore::DeprecationWarning
