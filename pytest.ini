[pytest]
testpaths = tests
pythonpath = . tests
# --basetemp: giữ thư mục tạm của pytest trong dự án thay vì %TEMP%\pytest-of-*.
# Ở thư mục mặc định, pytest tạo symlink 'pytest-current'; nếu symlink đó hỏng
# thì bước dọn dẹp cuối phiên ném PermissionError và pytest thoát với mã lỗi
# DÙ MỌI TEST ĐỀU PASS - làm test-commit.ps1 báo "TEST FAIL" giả và không chịu
# commit. Thư mục riêng trong dự án không có symlink nên không dính lỗi này.
# --durations=10: in 10 test chậm nhất sau mỗi lần chạy. CỐ Ý không kèm
# pytest-timeout: bộ test ở máy là lưới an toàn DUY NHẤT (CI không chạy), mà
# ngưỡng thời gian mỗi test sẽ đỏ oan đúng những lúc máy bận - và test-commit.ps1
# chặn commit khi có test đỏ. Đỏ oan là cách nhanh nhất khiến người ta bắt đầu
# bỏ qua bộ test. Ở đây chỉ thêm thông tin, không thêm đường thất bại nào.
addopts = -q --basetemp=.pytest-tmp --durations=10
filterwarnings =
    ignore::DeprecationWarning
